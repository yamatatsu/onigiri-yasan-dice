<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb066" />
      <stop offset="1" stop-color="#f2701f" />
    </linearGradient>
    <linearGradient id="rice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f1eadd" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <!-- maskable: セーフゾーン内に収まるよう縮小 -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <polygon points="256,150 140,372 372,372"
             fill="url(#rice)" stroke="url(#rice)"
             stroke-width="56" stroke-linejoin="round" />
    <rect x="196" y="296" width="120" height="104" rx="14" fill="#33413f" />
  </g>
</svg>
